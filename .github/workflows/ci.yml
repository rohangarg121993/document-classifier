name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported and a current one. Plain pip, no uv or venv, like the target machines.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Tesseract (German + English)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-deu tesseract-ocr-eng

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Taxonomy self-check
        # Every category should recognise its own synthetic page with confidence >= 0.5. 3 categories currently
        # fail (VPF01/VPF03 are duplicates, BAV07/BAV08 have placeholder definitions; see
        # docs/taxonomy-review.md). The reviewed draft passes all; lower this when it replaces the CSV.
        run: python docclassify.py selfcheck --categories config/categories.csv --max-failures 3
