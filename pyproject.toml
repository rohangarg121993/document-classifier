[project]
name = "docclassifier"
version = "0.1.0"
description = "Rule-based document page classifier: offline OCR plus keyword and similarity scoring against a category CSV"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "rapidfuzz>=3",
    "scikit-learn>=1.4",
]

[project.scripts]
docclassify = "docclassifier.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docclassifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tesseract: needs the Tesseract binary installed",
]
