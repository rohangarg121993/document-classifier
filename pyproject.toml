[project]
name = "docclassifier"
version = "0.1.0"
description = "Rule-based document page classifier: offline OCR plus keyword and similarity scoring against a category CSV"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "onnxruntime>=1.20",
    "pillow>=10",
    "pymupdf>=1.24",
    "pytesseract>=0.3.10",
    "scikit-learn>=1.4",
    "snowballstemmer>=2.2",
    "tokenizers>=0.20",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
docclassify = "docclassifier.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docclassifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "tesseract: needs the Tesseract binary installed",
    "encoder: needs the offline text encoder in models/ (docclassify fetch-model)",
]
