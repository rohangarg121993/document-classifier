# Default settings shipped with docclassifier.
# Override any subset of keys in your own TOML file and pass it with --settings.

[ocr]
# Tesseract language packs, joined with "+".
languages = "deu+eng"

[classifier]
# How many candidate categories to report.
top_n = 3

# Signal weights inside a region score.
synonym_weight = 0.35
phrase_weight = 0.25
# Cosine similarity of the page to the category profile (TF-IDF on character n-grams).
similarity_weight = 0.40

# Distinct keyword hits (after specificity and fuzzy weighting) that count as full evidence.
keyword_cap = 3
# Subtracted from a category's score per distinct negative-phrase hit.
negative_penalty = 0.15

# Keywords at least this long (normalised) also match the start of longer words (German compounds).
min_prefix_length = 6
# Keywords at least this long also match with OCR errors, at this rapidfuzz ratio or higher.
min_fuzzy_length = 6
fuzzy_threshold = 90
# A fuzzy hit counts this much of an exact hit.
fuzzy_weight = 0.7

[decision]
# confidence = score_weight × top score + margin_weight × (top score − second score)
confidence_score_weight = 0.7
confidence_margin_weight = 0.3
# Below this confidence the page is UNCLASSIFIED (reason "low_confidence").
threshold = 0.30
# Pages with fewer non-space characters are UNCLASSIFIED (reason "insufficient_text").
min_text_chars = 20
# Map every UNCLASSIFIED result to this category (e.g. "SON02"); empty keeps UNCLASSIFIED visible.
fallback_category_id = ""
