# Default settings shipped with docclassifier.
# Override any subset of keys in your own TOML file and pass it with --settings.

[ocr]
# OCR engine; "tesseract" is the only one in v1.
engine = "tesseract"
# Tesseract language packs, joined with "+".
languages = "deu+eng"
# Path to tesseract(.exe). Empty: TESSERACT_CMD, then PATH, then the default Windows install location.
tesseract_cmd = ""
# Resolution for rendering PDF pages before OCR.
dpi = 300
# OCR even when a PDF page has embedded text (for PDFs with broken text layers).
force_ocr = false
# Embedded PDF text with fewer non-space characters counts as missing, so the page is OCR'd.
min_native_chars = 20

# Handwriting / OCR quality heuristics (v1 detects handwriting, it does not read it).
# Pages with less ink than this share of their area are treated as blank.
min_ink_ratio = 0.002
# Words at or above this Tesseract confidence (0-100) count as recognised.
handwriting_min_word_confidence = 60
# Suspect handwriting when at least this share of the ink lies outside recognised words.
handwriting_unrecognised_ink = 0.5
# ocr_quality is "low" when the character-weighted mean word confidence is below this.
low_quality_mean_confidence = 60

[cache]
# Cache OCR results on disk. Entries contain page text (personal data): keep the directory local and
# git-ignored (ADR-0001).
enabled = true
dir = ".cache/ocr"

[classifier]
# How many candidate categories to report.
top_n = 3

# Evidence model (ADR-0003). Each signal removes part of the remaining doubt:
#   strength = 1 - (1 - synonym_reliability * synonym evidence)
#                * (1 - phrase_reliability * phrase evidence)
#                * (1 - similarity_reliability * similarity evidence)
#              - negative_penalty * negative hits
synonym_reliability = 0.95
phrase_reliability = 0.60
similarity_reliability = 0.50

# Distinct hits (after position, specificity and fuzzy weighting) that count as full evidence.
# One synonym (a document-type name) is enough; content phrases need several.
synonym_cap = 1
phrase_cap = 3
# Cosine similarity to the category profile that counts as full similarity evidence.
similarity_full = 0.5
# Share of similarity measured on the top of the page (top third and large print); the whole page gives the rest.
# The top names the document type, so a long body about something else doesn't outweigh it.
similarity_top_share = 0.6
# Below this many words the top holds just a title, which synonyms already count: the whole page decides alone.
similarity_top_min_words = 5
# Subtracted from a category's strength per distinct negative-phrase hit.
negative_penalty = 0.15

# Where on the page a hit appears. A synonym is a document-type name: it counts fully as a title, i.e. in the
# top third or in large print anywhere ("heading"), and less in running text further down.
# Per-category overrides for top/middle/bottom come from optional weight_top/middle/bottom CSV columns.
# Words at least this many times taller than the page's median word count as large print.
heading_ratio = 1.4
synonym_position_heading = 1.0
synonym_position_top = 1.0
synonym_position_middle = 0.5
synonym_position_bottom = 0.4
phrase_position_heading = 1.0
phrase_position_top = 1.0
phrase_position_middle = 0.8
phrase_position_bottom = 0.7

# Keywords at least this long (normalised) also match the start of longer words (German compounds).
min_prefix_length = 6
# Keywords at least this long also match with OCR errors, at this rapidfuzz ratio or higher.
min_fuzzy_length = 6
fuzzy_threshold = 90
# A fuzzy hit counts this much of an exact hit.
fuzzy_weight = 0.7
# A synonym found only at the start of a longer word counts this much: in German compounds the last part names
# the thing, so "Kündigungsfrist" is a notice period, not a Kündigung.
synonym_prefix_weight = 0.5

# Validated pages (ADR-0004): a page like one a person labelled with `learn` counts as evidence for that label.
# Cosine to the closest validated page, below the floor it is no evidence, from "full" it is full evidence.
# Measured on synthetic pages: same form, other person ~0.9; another form ~0.65; unrelated pages ~0.15.
example_reliability = 0.9
example_similarity_floor = 0.6
example_similarity_full = 0.85

[decision]
# confidence = winner strength × (1 - doubt of winner / doubt of runner-up), doubt = 1 - strength.
# Below this confidence the page is UNCLASSIFIED (reason "low_confidence") or, if one parent category is
# clear, "parent_only".
threshold = 0.50
# Pages with fewer non-space characters are UNCLASSIFIED (reason "insufficient_text").
min_text_chars = 20
# Map every UNCLASSIFIED result to this category (e.g. "SON02"); empty keeps UNCLASSIFIED visible.
fallback_category_id = ""
# Confidence ceiling for pages suspected to be handwritten; below the threshold, so they go to review.
handwriting_confidence_cap = 0.45

[feedback]
# Use pages a person validated with `learn` (ADR-0004). The store is derived from page text (personal data):
# keep the directory local and git-ignored (ADR-0001).
enabled = true
dir = ".cache/feedback"
