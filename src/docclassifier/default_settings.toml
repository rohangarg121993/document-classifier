# Default settings shipped with docclassifier.
# Override any subset of keys in your own TOML file and pass it with --settings.

[ocr]
# OCR engine; "tesseract" is the only one in v1.
engine = "tesseract"
# Tesseract language packs, joined with "+".
languages = "deu+eng"
# Path to tesseract(.exe). Empty: TESSERACT_CMD, then PATH, then the default Windows install location.
tesseract_cmd = ""
# Resolution for rendering PDF pages before OCR.
dpi = 300
# OCR even when a PDF page has embedded text (for PDFs with broken text layers).
force_ocr = false
# Embedded PDF text with fewer non-space characters counts as missing, so the page is OCR'd.
min_native_chars = 20

# Handwriting / OCR quality heuristics (v1 detects handwriting, it does not read it).
# Pages with less ink than this share of their area are treated as blank.
min_ink_ratio = 0.002
# Words at or above this Tesseract confidence (0-100) count as recognised.
handwriting_min_word_confidence = 60
# Suspect handwriting when at least this share of the ink lies outside recognised words.
handwriting_unrecognised_ink = 0.5
# ocr_quality is "low" when the character-weighted mean word confidence is below this.
low_quality_mean_confidence = 60

[cache]
# Cache OCR results on disk. Entries contain page text (personal data): keep the directory local and
# git-ignored (ADR-0001).
enabled = true
dir = ".cache/ocr"

[classifier]
# How many candidate categories to report.
top_n = 3

# Signal weights inside a region score.
synonym_weight = 0.35
phrase_weight = 0.25
# Cosine similarity of the page to the category profile (TF-IDF on character n-grams).
similarity_weight = 0.40

# Distinct keyword hits (after specificity and fuzzy weighting) that count as full evidence.
keyword_cap = 3
# Subtracted from a category's score per distinct negative-phrase hit.
negative_penalty = 0.15

# Keywords at least this long (normalised) also match the start of longer words (German compounds).
min_prefix_length = 6
# Keywords at least this long also match with OCR errors, at this rapidfuzz ratio or higher.
min_fuzzy_length = 6
fuzzy_threshold = 90
# A fuzzy hit counts this much of an exact hit.
fuzzy_weight = 0.7

# Region weights: thirds of the page by vertical position, plus the full page.
# Per-category overrides come from optional weight_<region> columns in the category CSV.
region_weight_top = 0.40
region_weight_middle = 0.20
region_weight_bottom = 0.15
region_weight_full = 0.25
# Regions with fewer non-space characters are skipped and their weight shared among the others.
min_region_chars = 10

[decision]
# confidence = score_weight × top score + margin_weight × (top score − second score)
confidence_score_weight = 0.7
confidence_margin_weight = 0.3
# Below this confidence the page is UNCLASSIFIED (reason "low_confidence").
threshold = 0.30
# Pages with fewer non-space characters are UNCLASSIFIED (reason "insufficient_text").
min_text_chars = 20
# Map every UNCLASSIFIED result to this category (e.g. "SON02"); empty keeps UNCLASSIFIED visible.
fallback_category_id = ""
# Confidence ceiling for pages suspected to be handwritten; below the threshold, so they go to review.
handwriting_confidence_cap = 0.25
