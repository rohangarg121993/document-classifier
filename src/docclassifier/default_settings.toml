# Default settings shipped with docclassifier.
# Override any subset of keys in your own TOML file and pass it with --settings.

[ocr]
# OCR engine; "tesseract" is the only one in v1.
engine = "tesseract"
# Tesseract language packs, joined with "+".
languages = "deu+eng"
# Path to tesseract(.exe). Empty: TESSERACT_CMD, then PATH, then the default Windows install location.
tesseract_cmd = ""
# Resolution for rendering PDF pages before OCR.
dpi = 300
# OCR even when a PDF page has embedded text (for PDFs with broken text layers).
force_ocr = false
# Embedded PDF text with fewer non-space characters counts as missing, so the page is OCR'd.
min_native_chars = 20

# Handwriting / OCR quality heuristics (v1 detects handwriting, it does not read it).
# Pages with less ink than this share of their area are treated as blank.
min_ink_ratio = 0.002
# Words at or above this Tesseract confidence (0-100) count as recognised.
handwriting_min_word_confidence = 60
# Suspect handwriting when at least this share of the ink lies outside recognised words.
handwriting_unrecognised_ink = 0.5
# ocr_quality is "low" when the character-weighted mean word confidence is below this.
low_quality_mean_confidence = 60

[cache]
# Cache OCR results on disk. Entries contain page text (personal data): keep the directory local and
# git-ignored (ADR-0001).
enabled = true
dir = ".cache/ocr"

[classifier]
# Title-first classification (ADR-0005): find the document's title, match it against the synonyms, and let the
# content decide only when the title doesn't.
# How many candidate categories to report.
top_n = 3
# Words at least this many times taller than the page's median word count as large print (a title candidate).
heading_ratio = 1.4
# Synonyms at least this long (normalised) also name a title as the last part of a compound:
# "Verhaltensabmahnung" is an Abmahnung.
min_compound_length = 6
# Confidence when the title names exactly one category (or names one and its siblings fit no better).
title_match_confidence = 0.9
# Positive phrases found that count as full phrase evidence in the content match.
phrase_cap = 3

# Validated pages (ADR-0004): a page that nearly repeats one a person labelled with `learn` gets that label.
# Similarity (character n-grams) to the closest validated page from which it counts as a repeat. Measured on
# synthetic pages: same form, other person ~0.9; another form ~0.65; unrelated pages ~0.15.
example_similarity = 0.85
example_confidence = 0.9
# Share of that similarity measured on the top of the page (top third and large print); the whole page gives the
# rest. Below this many words the top holds just a title, and the whole page decides alone.
similarity_top_share = 0.6
similarity_top_min_words = 5

[decision]
# Below this confidence the page is UNCLASSIFIED (reason "low_confidence").
threshold = 0.50
# Pages with fewer non-space characters are UNCLASSIFIED (reason "insufficient_text").
min_text_chars = 20
# Map every UNCLASSIFIED result to this category (e.g. "SON02"); empty keeps UNCLASSIFIED visible.
fallback_category_id = ""
# Confidence ceiling for pages suspected to be handwritten; below the threshold, so they go to review.
handwriting_confidence_cap = 0.45

[feedback]
# Use pages a person validated with `learn` (ADR-0004). The store is derived from page text (personal data):
# keep the directory local and git-ignored (ADR-0001).
enabled = true
dir = ".cache/feedback"

[context]
# When the title names no category, or several of one family, compare the page's meaning with each category's
# name, description and positive phrases, using the offline sentence encoder shipped in models/ (ADR-0005).
# A relative directory is relative to the repository. Without it (enabled = false) only titles decide.
enabled = true
model_dir = "models/multilingual-e5-small"
# Classify by meaning only when the best category leads the runner-up by at least this cosine margin.
# On 50 benchmark pages: margin >= 0.02 was right 11 of 13 times; below it, right and wrong are mixed.
min_margin = 0.02
# Confidence reported for a page classified by meaning alone (a title match reports title_match_confidence).
confidence = 0.6
# Added to a category's meaning score at full positive-phrase evidence (phrase_cap distinct phrases, matched by
# word stems); subtracted per negative-phrase hit. Cosines of different categories lie within ~0.05 of each
# other, so one phrase (0.1 / 3) already outweighs a typical difference in meaning.
phrase_weight = 0.1
# The same, when choosing between the categories the title named (e.g. Kündigung by employee or employer):
# the title fixed the topic, so meaning hardly differs and the categories' own phrases must decide.
sibling_phrase_weight = 0.3
negative_weight = 0.05
